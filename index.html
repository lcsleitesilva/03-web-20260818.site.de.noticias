<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site de notícias</title>
    <link rel="stylesheet" href="./assets/css/estilo.css">
    <script src="./assets/login.js"></script>
    <script src="https://kit.fontawesome.com/ec3a3fcdd8.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div id="logoDoSite" class="logo">L</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
        <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="container">
            <h1> login</h1>
            <form>
                <div class="input-grupo">
                    <i class="fas fa-envelope"></i>
                    <input id="email" type="email" placeholder="Informe seu email">
                </div>
                <div class="icon">
                </div>
                <div class="input-grupo">
                    <i class="fas fa-lock"></i>
                    <input id="senha" type="password" placeholder="Informe sua senha">
                </div>
                <button onclick="verificarCredenciais()" return false;>
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
            </form>
        </div>
        <div class="links auxiliares">
            <a href="#">Esqueceu a senha?</a>
            <span>-</span>
            <a href="#">Registrar-se</a>
        </div>

</body>

</html>
