<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site de noticias</title>
    <link rel="stylesheet" href="./assets/css/login/estilo.css">
  <script src="./assets/js/bd.js"></script>
<script src="./assets/js/login.js"></script>
    <script src="https://kit.fontawesome.com/d424a9779f.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>

<body>
    <header>
        <div class="logo">P</div>
        <h1 class="titulo">Meu site de Noticias</h1>
    </header>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="input-grupo">
                <i class="fas fa-envelope"></i>
                <input id="email" type="email" placeholder="Informe seu e-mail">
            </div>
            <div class="input-grupo">
                <i class="fas fa-lock"></i>
                <input id="senha" type="password" placeholder="Informe sua senha" />
            </div>
            <button onclick="verificarCredenciais();return false;">
                <i class="fas fa-sign-in-alt"></i>
                Entrar
            </button>
        </form>
            <div class="links-auxiliares">
                <a href="#">Esqueceu a senha?</a>
                <span>-</span>
                <a href="#">Registra-se</a>
            </div>
   </div>      

   
</body>

</html>
